<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}WordNext AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>

<!-- ══════════════ ANIMATED BACKGROUND ══════════════ -->
<div class="bg-canvas">
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>
  <div class="bg-grid"></div>
</div>

<!-- ══════════════ SIDEBAR NAV ══════════════ -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
        <circle cx="5"  cy="11" r="3" fill="#D6A34A"/>
        <circle cx="17" cy="5"  r="3" fill="#9B8AFB"/>
        <circle cx="17" cy="17" r="3" fill="#D6A34A" fill-opacity="0.6"/>
        <line x1="8"  y1="10" x2="14" y2="6.5"  stroke="#9B8AFB" stroke-width="1.4"/>
        <line x1="8"  y1="12" x2="14" y2="15.5" stroke="#D6A34A" stroke-width="1.4"/>
        <line x1="17" y1="8"  x2="17" y2="14"   stroke="#9B8AFB" stroke-width="1.4"/>
      </svg>
    </div>
    <div>
      <div class="logo-name">WordNext<span class="logo-ai">AI</span></div>
      <div class="logo-sub">Markov Chain NLP</div>
    </div>
  </div>

  <nav class="sidebar-nav">
    <a href="/"           class="nav-item {% if request.path == '/' %}active{% endif %}">
      <span class="nav-icon">◈</span>
      <span>Dashboard</span>
    </a>
    <a href="/predictor"  class="nav-item {% if request.path == '/predictor' %}active{% endif %}">
      <span class="nav-icon">⟡</span>
      <span>Live Predictor</span>
    </a>
    <a href="/analytics"  class="nav-item {% if request.path == '/analytics' %}active{% endif %}">
      <span class="nav-icon">◎</span>
      <span>Analytics</span>
    </a>
    <a href="/comparison" class="nav-item {% if request.path == '/comparison' %}active{% endif %}">
      <span class="nav-icon">⊕</span>
      <span>DBMS vs DSA</span>
    </a>
  </nav>

  <div class="sidebar-footer">
    <div class="sf-badge">BTech Project</div>
    <div class="sf-sub">Probability &amp; Statistics</div>
  </div>
</aside>

<!-- ══════════════ MAIN CONTENT ══════════════ -->
<main class="main-content">

  <!-- Mobile header -->
  <header class="mobile-header">
    <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="mobile-logo">WordNext<span class="logo-ai">AI</span></span>
  </header>

  {% block content %}{% endblock %}

</main>

<!-- ══════════════ TOAST NOTIFICATION ══════════════ -->
<div class="toast" id="toast"></div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
{% block scripts %}{% endblock %}

<script>
function toggleSidebar() {
  document.querySelector('.sidebar').classList.toggle('open');
}
</script>
</body>
</html>
